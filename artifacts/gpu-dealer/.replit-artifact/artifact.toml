kind = "web"
previewPath = "/"
title = "GPUDealer"
description = "GPUDealer.com — a specialized marketplace and discovery platform for used GPUs and AI hardware. Sellers can list hardware, buyers can browse and search listings, and registered users can submit hardware procurement requests when they can't find what they need. The platform captures supply and demand for used GPU and AI compute hardware."
version = "1.0.0"
id = "artifacts/gpu-dealer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22792

[services.development]
run = "pnpm --filter @workspace/gpu-dealer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gpu-dealer", "run", "build" ]
serve = "static"
publicDir = "artifacts/gpu-dealer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22792"
BASE_PATH = "/"
