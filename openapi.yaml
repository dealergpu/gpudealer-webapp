openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GPUDealer API specification
servers:
  - url: /api/v1
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: listings
    description: Hardware listing operations
  - name: requests
    description: Hardware request (buyer demand) operations
  - name: saved
    description: Saved listing operations
  - name: inquiries
    description: Buyer-to-seller inquiry operations
  - name: stats
    description: Statistics and dashboard operations
  - name: users
    description: User profile operations
  - name: apiKeys
    description: Personal API key management (session auth only)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: List/search hardware listings
      description: >-
        Public; no auth required for public results. Rate-limited to 60
        req/min per user/IP. Passing a non-public `status` (DRAFT,
        PENDING_REVIEW, REJECTED, EXPIRED) requires auth and always scopes
        the result to the caller's own listings — this doubles as the "My
        Listings" query, e.g. `?status=DRAFT` while signed in.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Free-text search over title/description/normalized model
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ListingCategory" }
        - name: gpuModel
          in: query
          schema: { type: string }
          description: Matched against normalized model (RTX 4090, rtx4090, 4090 all match)
        - name: manufacturer
          in: query
          schema: { type: string }
        - name: minVramGb
          in: query
          schema: { type: integer }
        - name: maxVramGb
          in: query
          schema: { type: integer }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: currency
          in: query
          schema: { type: string }
        - name: condition
          in: query
          schema: { $ref: "#/components/schemas/ListingCondition" }
        - name: country
          in: query
          schema: { type: string }
        - name: region
          in: query
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
        - name: sourceType
          in: query
          schema: { $ref: "#/components/schemas/ListingSourceType" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ListingStatus" }
          description: >-
            Defaults to PUBLISHED. A non-public value (DRAFT,
            PENDING_REVIEW, REJECTED, EXPIRED) requires auth and only ever
            returns the caller's own listings.
        - name: mine
          in: query
          schema: { type: boolean }
          description: >-
            Auth required. Returns only the caller's own listings, in every
            status — the "My Listings" query.
        - name: sortBy
          in: query
          schema: { $ref: "#/components/schemas/ListingSortBy" }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 24, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Listings response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"
        "401":
          description: Unauthorized (only when requesting a non-public status)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new hardware listing (auth required)
      description: >-
        Requires Authorization; rate-limited to 20/hour per user. The
        seller is taken from the verified auth token — the client cannot
        set it. New listings always start as DRAFT; there is no way to
        create one already PUBLISHED. The server auto-generates `slug`
        and `normalizedModel`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing by ID
      description: >-
        Optional auth. PUBLISHED or SOLD listings are visible to anyone.
        Any other status (DRAFT, PENDING_REVIEW, REJECTED, EXPIRED)
        returns 404 to everyone except the owning seller or an admin —
        deliberately 404 rather than 403, so the API never reveals that a
        private listing exists. Fires a LISTING_VIEWED analytics event.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing (auth required, must be owner or admin)
      description: Same body shape as create, all fields optional (partial update).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Forbidden — not the owner or an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing (auth required, must be owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /listings/{id}/status:
    patch:
      operationId: updateListingStatus
      tags: [listings]
      summary: Move a listing through its lifecycle (auth required)
      description: >-
        Allowed transitions are enforced server-side and differ by role.
        Owner (seller): DRAFT -> PENDING_REVIEW, PUBLISHED -> SOLD. Admin:
        DRAFT -> PENDING_REVIEW, PENDING_REVIEW -> PUBLISHED/REJECTED,
        PUBLISHED -> SOLD/EXPIRED. A seller cannot self-publish — that
        must go through admin review. Any other transition returns 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingStatusUpdate"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "409":
          description: Disallowed transition for this role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /listings/{listingId}/inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Contact a seller about a listing (auth required)
      description: >-
        Rate-limited to 20/hour per user. `buyerId` is the caller (from
        the token); `sellerId` is derived server-side from the listing's
        `sellerId` — neither is client-supplied. Does not currently check
        listing visibility, so a listing can be inquired on by ID even in
        DRAFT (flagged by the backend team as a pending product decision,
        not treated as a bug).
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Created inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResponse"
        "400":
          description: Validation error, e.g. inquiring on your own listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "404":
          description: Listing not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /inquiries:
    get:
      operationId: getInquiries
      tags: [inquiries]
      summary: Get the authenticated user's inquiries (sent and received)
      description: >-
        Returns only inquiries where the caller is the buyer or the seller
        (admins see all). This is a single feed for both "sent" and
        "received" — filter client-side on buyerId/sellerId against the
        current user's ID to split into tabs.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/InquiryStatus" }
      responses:
        "200":
          description: Inquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiriesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /inquiries/{id}/status:
    patch:
      operationId: updateInquiryStatus
      tags: [inquiries]
      summary: Update an inquiry's status (auth required, participant or admin only)
      description: >-
        Only the buyer, the seller, or an admin may change it. No
        status-transition graph is enforced (unlike listings/requests) —
        any participant can set any of the three values at any time.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryStatusUpdate"
      responses:
        "200":
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Forbidden — not a participant or an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /requests:
    get:
      operationId: getRequests
      tags: [requests]
      summary: Get the authenticated user's hardware requests
      description: >-
        Auth required. Non-admins only ever see their own requests
        (userId forced server-side) — there's no way to browse other
        users' demand requests through this endpoint, by design (these
        are private leads, not public listings). Admins see everyone's.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/HardwareRequestStatus" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ListingCategory" }
      responses:
        "200":
          description: Hardware requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareRequestsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    post:
      operationId: createRequest
      tags: [requests]
      summary: Submit a hardware request (auth required)
      description: >-
        Rate-limited to 20/hour per user. `userId` comes from the token.
        Status always starts OPEN. This is a lead-capture form, not a
        listing (see CLAUDE.md section 21/23).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardwareRequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a hardware request by ID (owner or admin only)
      description: >-
        Returns 403 (not 404, unlike listings) if you don't own it and
        aren't an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareRequestResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update a hardware request (auth required, owner or admin only)
      description: Partial update of any of the create-body fields.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardwareRequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    delete:
      operationId: deleteRequest
      tags: [requests]
      summary: Delete a hardware request (auth required, owner or admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /requests/{id}/status:
    patch:
      operationId: updateRequestStatus
      tags: [requests]
      summary: Move a hardware request through its lifecycle (auth required)
      description: >-
        Owner: OPEN -> CANCELLED, MATCHED -> CANCELLED. Admin: OPEN ->
        MATCHED/CANCELLED, MATCHED -> CLOSED/CANCELLED. A requester can
        cancel their own request but can't self-mark it MATCHED or
        CLOSED — that's an admin/procurement action.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardwareRequestStatusUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "409":
          description: Disallowed transition for this role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /saved-listings:
    get:
      operationId: getSavedListings
      tags: [saved]
      summary: Get the authenticated user's saved listings
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 24 }
      responses:
        "200":
          description: Saved listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedListingsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /saved-listings/{listingId}:
    post:
      operationId: saveListing
      tags: [saved]
      summary: Save a listing (auth required)
      description: >-
        No body. Idempotent (upsert on userId+listingId) — calling it
        twice returns the same row, 201 both times. Runs the same
        visibility check as `GET /listings/:id` — 404 if the listing
        doesn't exist or isn't visible to the caller, so you can only
        save what you could otherwise legally view.
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedListingResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "404":
          description: Listing doesn't exist or isn't visible to the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    delete:
      operationId: unsaveListing
      tags: [saved]
      summary: Remove a saved listing
      description: Safe to call even if it was never saved (no error either way).
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard summary stats (auth required)
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized

  /stats/marketplace:
    get:
      operationId: getMarketplaceStats
      tags: [stats]
      summary: Get public marketplace statistics
      responses:
        "200":
          description: Marketplace stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceStats"

  /me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get the authenticated user's own profile
      description: Always operates on the token's own user, never an arbitrary ID.
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    patch:
      operationId: updateProfile
      tags: [users]
      summary: Update the authenticated user's own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api-keys:
    get:
      operationId: getApiKeys
      tags: [apiKeys]
      summary: List the authenticated user's active API keys
      description: >-
        Active (non-revoked) keys only, newest first. Never includes the
        secret. Session auth only — requests authenticated with an API key
        get 403.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 24 }
      responses:
        "200":
          description: Active API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeysResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Called with an API key instead of a session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

    post:
      operationId: createApiKey
      tags: [apiKeys]
      summary: Create an API key
      description: >-
        The response is the only time the full secret (`key`) is returned.
        409 when the user already has 10 active keys.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyInput" }
      responses:
        "201":
          description: Created — includes the secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyWithSecretResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Called with an API key instead of a session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "409":
          description: Active key limit (10) reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api-keys/{id}/rotate:
    post:
      operationId: rotateApiKey
      tags: [apiKeys]
      summary: Rotate an API key
      description: >-
        No body. Revokes the key immediately and returns a NEW key (new id,
        same name) including its secret, shown once.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Replacement key — includes the secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyWithSecretResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Called with an API key instead of a session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "404":
          description: Key not found or already revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [apiKeys]
      summary: Revoke an API key
      description: Takes effect immediately and can't be undone.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403":
          description: Called with an API key instead of a session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "404":
          description: Key not found or already revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ListingCategory:
      type: string
      enum: [GPU, SERVER, MEMORY, OTHER]

    ListingCondition:
      type: string
      enum: [NEW, USED, REFURBISHED, UNKNOWN]

    ListingSourceType:
      type: string
      enum: [GPUDEALER, EBAY, REDDIT, FACEBOOK, OTHER]

    ListingStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, PUBLISHED, REJECTED, SOLD, EXPIRED]

    ListingSortBy:
      type: string
      enum: [relevance, price_asc, price_desc, newest]

    ListingImage:
      type: object
      required: [url]
      properties:
        id: { type: ["string", "null"] }
        url: { type: string }
        sortOrder: { type: integer, default: 0 }
        altText: { type: ["string", "null"] }

    Listing:
      type: object
      required: [id, sellerId, title, category, condition, price, currency, status, slug, createdAt]
      properties:
        id: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        title: { type: string }
        description: { type: ["string", "null"] }
        category: { $ref: "#/components/schemas/ListingCategory" }
        manufacturer: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        gpuModel: { type: ["string", "null"] }
        normalizedModel: { type: ["string", "null"] }
        vramGb: { type: ["integer", "null"] }
        quantity: { type: integer, default: 1 }
        condition: { $ref: "#/components/schemas/ListingCondition" }
        price:
          type: string
          description: Decimal amount serialized as a string, e.g. "1299.99"
        currency: { type: string, default: "USD" }
        locationCountry: { type: ["string", "null"] }
        locationRegion: { type: ["string", "null"] }
        locationCity: { type: ["string", "null"] }
        sourceType: { $ref: "#/components/schemas/ListingSourceType" }
        cpuModel: { type: ["string", "null"] }
        ramGb: { type: ["integer", "null"] }
        storageGb: { type: ["integer", "null"] }
        memoryType: { type: ["string", "null"] }
        memorySpeed: { type: ["integer", "null"] }
        memoryCapacityGb: { type: ["integer", "null"] }
        ecc: { type: ["boolean", "null"] }
        formFactor: { type: ["string", "null"] }
        # NOTE: not part of the backend contract shared with the frontend
        # team — kept optional so the UI degrades gracefully if it's
        # absent or named differently server-side. Confirm the real field
        # name for the third-party "original listing" URL before relying
        # on it (see CLAUDE.md section 27).
        sourceUrl: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/ListingStatus" }
        slug: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/ListingImage" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }

    ListingInput:
      type: object
      required: [title, category, condition, price, currency]
      properties:
        title: { type: string }
        description: { type: string, maxLength: 10000 }
        category: { $ref: "#/components/schemas/ListingCategory" }
        manufacturer: { type: string }
        model: { type: string }
        gpuModel: { type: string }
        vramGb: { type: integer }
        quantity: { type: integer, default: 1 }
        condition: { $ref: "#/components/schemas/ListingCondition" }
        price: { type: number }
        currency: { type: string, default: "USD" }
        locationCountry: { type: string }
        locationRegion: { type: string }
        locationCity: { type: string }
        images:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              sortOrder: { type: integer, default: 0 }
              altText: { type: string }

    ListingUpdate:
      type: object
      description: >-
        Partial update — fields that are omitted are left unchanged; null
        clears an optional field. `images`, when sent, replaces the whole
        photo set (array order = display order; [] removes all photos).
        Image URLs must be public gpu-pics bucket URLs inside the caller's
        own `<supabase user id>/` folder. Owner only (403 otherwise).
      properties:
        title: { type: string }
        description: { type: ["string", "null"], maxLength: 10000 }
        category: { $ref: "#/components/schemas/ListingCategory" }
        manufacturer: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        gpuModel: { type: ["string", "null"] }
        vramGb: { type: ["integer", "null"] }
        quantity: { type: integer }
        condition: { $ref: "#/components/schemas/ListingCondition" }
        price: { type: number }
        currency: { type: string }
        locationCountry: { type: ["string", "null"] }
        locationRegion: { type: ["string", "null"] }
        locationCity: { type: ["string", "null"] }
        cpuModel: { type: ["string", "null"] }
        ramGb: { type: ["integer", "null"] }
        storageGb: { type: ["integer", "null"] }
        memoryType: { type: ["string", "null"] }
        memorySpeed: { type: ["integer", "null"] }
        memoryCapacityGb: { type: ["integer", "null"] }
        ecc: { type: ["boolean", "null"] }
        formFactor: { type: ["string", "null"] }
        images:
          type: array
          maxItems: 20
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              altText: { type: string }

    ListingStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ListingStatus" }

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    ListingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Listing" }

    ListingsResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Listing" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, INTERNAL_ERROR]
            message: { type: string }
            fields: { type: object, additionalProperties: true }

    SavedListing:
      type: object
      required: [id, userId, listingId, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        # Only populated on GET /saved-listings — a snapshot of the
        # listing as it was when saved. It is NOT re-checked for
        # visibility on read, so it can keep showing a listing the
        # seller has since reverted to DRAFT.
        listing:
          allOf:
            - $ref: "#/components/schemas/Listing"
          nullable: true

    SavedListingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/SavedListing" }

    SavedListingsResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SavedListing" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    InquiryStatus:
      type: string
      enum: [OPEN, RESPONDED, CLOSED]

    InquiryInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }

    InquiryStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/InquiryStatus" }

    Inquiry:
      type: object
      required: [id, listingId, buyerId, sellerId, message, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        buyerId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        message: { type: string }
        status: { $ref: "#/components/schemas/InquiryStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }
        # Only populated on GET /inquiries.
        listing:
          allOf:
            - $ref: "#/components/schemas/Listing"
          nullable: true

    InquiryResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Inquiry" }

    InquiriesResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Inquiry" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    HardwareRequestStatus:
      type: string
      enum: [OPEN, MATCHED, CLOSED, CANCELLED]

    HardwareRequest:
      type: object
      required: [id, userId, category, title, requestedModel, quantity, conditionPreference, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/ListingCategory" }
        title: { type: string }
        description: { type: ["string", "null"] }
        requestedModel: { type: string }
        quantity: { type: integer }
        minVramGb: { type: ["integer", "null"] }
        maxBudgetPerUnit: { type: ["number", "null"] }
        maxTotalBudget: { type: ["number", "null"] }
        currency: { type: string, default: "USD" }
        conditionPreference: { $ref: "#/components/schemas/ListingCondition" }
        preferredCountry: { type: ["string", "null"] }
        destinationCountry: { type: ["string", "null"] }
        destinationCity: { type: ["string", "null"] }
        neededBy: { type: ["string", "null"], format: date-time }
        # NOTE: the backend confirmed this field and one example value
        # ("WITHIN_1_MONTH") but not the full enum — left as a free
        # string rather than guessing the other members. Not currently
        # exposed as a choice in the create/edit form for that reason.
        urgency: { type: ["string", "null"] }
        specifications:
          type: ["object", "null"]
          additionalProperties: true
        status: { $ref: "#/components/schemas/HardwareRequestStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }

    HardwareRequestInput:
      type: object
      required: [category, title, requestedModel, quantity, conditionPreference]
      properties:
        category: { $ref: "#/components/schemas/ListingCategory" }
        title: { type: string }
        description: { type: string }
        requestedModel: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        minVramGb: { type: integer }
        maxBudgetPerUnit: { type: number }
        maxTotalBudget: { type: number }
        currency: { type: string, default: "USD" }
        conditionPreference: { $ref: "#/components/schemas/ListingCondition" }
        preferredCountry: { type: string }
        destinationCountry: { type: string }
        destinationCity: { type: string }
        neededBy: { type: string, format: date-time }
        urgency: { type: string }
        specifications:
          type: object
          additionalProperties: true

    HardwareRequestUpdate:
      type: object
      description: Partial update of any HardwareRequestInput field.
      properties:
        category: { $ref: "#/components/schemas/ListingCategory" }
        title: { type: string }
        description: { type: string }
        requestedModel: { type: string }
        quantity: { type: integer }
        minVramGb: { type: integer }
        maxBudgetPerUnit: { type: number }
        maxTotalBudget: { type: number }
        currency: { type: string }
        conditionPreference: { $ref: "#/components/schemas/ListingCondition" }
        preferredCountry: { type: string }
        destinationCountry: { type: string }
        destinationCity: { type: string }
        neededBy: { type: string, format: date-time }
        urgency: { type: string }
        specifications:
          type: object
          additionalProperties: true

    HardwareRequestStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/HardwareRequestStatus" }

    HardwareRequestResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/HardwareRequest" }

    HardwareRequestsResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HardwareRequest" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    DashboardStats:
      type: object
      required: [activeListings, pendingListings, openRequests, savedCount, recentListings, recentRequests]
      properties:
        activeListings: { type: integer }
        pendingListings: { type: integer }
        openRequests: { type: integer }
        savedCount: { type: integer }
        recentListings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        recentRequests:
          type: array
          items:
            $ref: "#/components/schemas/HardwareRequest"

    MarketplaceStats:
      type: object
      required: [totalListings, totalRequests, popularModels]
      properties:
        totalListings: { type: integer }
        totalRequests: { type: integer }
        popularModels:
          type: array
          items:
            $ref: "#/components/schemas/ModelCount"

    ModelCount:
      type: object
      required: [model, count]
      properties:
        model: { type: string }
        count: { type: integer }

    UserProfile:
      type: object
      required: [id, email, createdAt]
      properties:
        # Backend user id — the value used in sellerId/buyerId. Not the
        # Supabase auth id (that's supabaseUserId).
        id: { type: string }
        supabaseUserId: { type: string }
        email: { type: string }
        name: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        companyName: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        role: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/UserProfile" }

    UserProfileUpdate:
      type: object
      properties:
        displayName: { type: string }
        company: { type: string }
        location: { type: string }
        bio: { type: string }

    ApiKey:
      type: object
      required: [id, name, keyPrefix, lastUsedAt, revokedAt, createdAt, userId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        # Non-secret leading characters of the key, e.g. "gpd_ab12".
        keyPrefix: { type: string }
        lastUsedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        userId: { type: string }

    ApiKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            # The full secret ("gpd_..."). Only returned on create/rotate.
            key: { type: string }

    ApiKeyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    ApiKeysResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    ApiKeyWithSecretResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ApiKeyWithSecret" }
